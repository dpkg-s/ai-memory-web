# 推 tag（v*）时自动发布 Release：先跑全量回归，再建 Release。
#
# 标题约定：Release 标题 = 「tag — 一句话描述」，取自**带注释 tag 的 subject**
#   （`git tag -a v1.2.0 -m "v1.2.0 — 描述"`）；轻量 tag（无注释）回落为 tag 名。
#
# ⚠️ 不从本地 `git tag -l --format='%(contents:subject)'` 取标题：runner 上本地 tag
#   未必是带注释形态，该占位符会**静默退回被指向提交的主题**（核心仓 v3.0.0 曾因此
#   把 Release 标题写成 commit subject）。这里改走 API 先看 ref 的 object.type，
#   确为 tag 才读它的 message；任何一步失败都老实回落为 tag 名 —— 宁可为空，不可为错。
#
# 与核心仓的差异：本仓不做 SHA256 清单。
#
# ⚠️ 2026-10-22：**Release 现在带两个附件**。
#   1. `web-console-<tag>.tgz` —— 控制台源码包（排除 `.github/` 与 `tests/`），
#      与历史 Release 的附件形态一致，由本工作流现场打包，不再手工上传。
#   2. `ai-memory-setup.exe` —— **快捷安装器，与核心仓是同一个文件**。
#      本仓不构建它（它由核心仓在本地 conda 环境打出、随 `dist/` 入库），
#      这里只从核心仓的 latest Release 把附件搬过来转挂。
#      ⇒ **发布顺序：核心仓先、本仓后**，否则会搬到上一版的安装器。
#      搬运失败直接红，不静默产出「没有安装器」的 Release。
#
# ⚠️ 2026-10-22 版本门禁：tag 名、`web_console.py` 的 `WEB_VERSION`、CHANGELOG 首条
#   三者必须一致，任一不符在跑测试之前就判红。本仓没有 `VERSION` 文件 ——
#   常量就是唯一机器可读版本源（刻意不引入第二处）。历史漂移：`WEB_VERSION`
#   曾停在 1.11.1 而 tag 已 v1.11.3，界面「关于」显示旧号，两版无人发现。
#
# ⚠️ 2026-10-22 校验和：两个二进制附件各附 `<文件名>.sha256`（`sha256sum` 格式，
#   只记裸文件名）。exe 的校验和与核心仓**必须一致** —— 是同一个字节。
#
# ⚠️ 2026-10-27 正文口径：Release 正文优先取 `.github/release-notes/<tag>.md`。
#   此前一律 `--generate-notes`，正文只有 "What's Changed" 和 PR 列表 —— 那是给
#   改代码的人看的，而 Release 正文的读者是**装了但不动代码的人**。本仓跟随
#   docker / core 的口径：打 tag 前在 `.github/release-notes/<tag>.md` 写一份
#   用户视角的说明；不写也能发，但会退回自动生成。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout core（测试的端到端段需要 serve_http.py）
        uses: actions/checkout@v4
        with:
          repository: dpkg-s/ai-memory-template
          path: _core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          CONST="$(grep -m1 -oE '^WEB_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' web_console.py | tr -dc '0-9.')"
          TOP="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -dc '0-9.')"
          echo "tag=$V  WEB_VERSION=$CONST  CHANGELOG=$TOP"
          if [ "$CONST" != "$V" ]; then
            echo "::error::WEB_VERSION($CONST) 与 tag($V) 不一致 —— 改版本时 web_console.py 与 CHANGELOG 要一起改"
            exit 1
          fi
          if [ "$TOP" != "$V" ]; then
            echo "::error::CHANGELOG 首条 [$TOP] 与 tag($V) 不一致 —— 先在 CHANGELOG 顶部补一条 ## [$V] - 日期"
            exit 1
          fi

      - name: Run tests before publishing
        env:
          AI_MEMORY_CORE_DIR: ${{ github.workspace }}/_core
        run: |
          pip install -r requirements.txt
          python tests/test_web.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="$TAG"
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                   --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          KIND="${OBJ%% *}"; SHA="${OBJ##* }"
          if [ "$KIND" = "tag" ]; then
            MSG="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" \
                     --jq '.message' 2>/dev/null || true)"
            SUBJ="$(printf '%s\n' "$MSG" | head -n1)"
            if [ -n "$SUBJ" ]; then TITLE="$SUBJ"; fi
          fi
          echo "release title = $TITLE"
          NOTES_FILE=".github/release-notes/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "release body = $NOTES_FILE（人工写，用户视角）"
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "release body = 自动生成（未提供 $NOTES_FILE）"
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi

      # 附件一：控制台源码包。排除 .github/ 与 tests/，与历史 Release 的 tgz 形态对齐。
      - name: Attach source tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _asset/pack
          git archive --format=tar --prefix=web-console/ "$TAG" -o _asset/wc.tar
          tar -xf _asset/wc.tar -C _asset/pack
          rm -rf _asset/pack/web-console/.github _asset/pack/web-console/tests
          tar -czf "_asset/web-console-$TAG.tgz" -C _asset/pack web-console
          ls -l "_asset/web-console-$TAG.tgz"
          ( cd _asset && sha256sum "web-console-$TAG.tgz" > "web-console-$TAG.tgz.sha256" )
          cat "_asset/web-console-$TAG.tgz.sha256"
          gh release upload "$TAG" "_asset/web-console-$TAG.tgz" "_asset/web-console-$TAG.tgz.sha256" --clobber

      # 附件二：快捷安装器。**不在这里构建** —— 从核心仓 latest Release 搬附件转挂，
      # 保证两边用户拿到的 exe 是同一个字节。核心仓尚未发布时这里会红，属预期。
      - name: Attach installer exe（搬自核心仓）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _asset
          URL="https://github.com/dpkg-s/ai-memory-template/releases/latest/download/ai-memory-setup.exe"
          echo "source: $URL"
          curl -fL --retry 3 --retry-delay 2 -o _asset/ai-memory-setup.exe "$URL"
          SZ=$(stat -c%s _asset/ai-memory-setup.exe)
          echo "downloaded $SZ bytes"
          # 安装器实际约 12 MB；明显偏小说明下到的是错误页或残缺文件。
          if [ "$SZ" -lt 10000000 ]; then
            echo "::error::下载到的 exe 只有 $SZ 字节，疑似错误页/残缺文件 —— 检查核心仓 latest Release 是否已挂安装器"
            exit 1
          fi
          gh release upload "$TAG" _asset/ai-memory-setup.exe --clobber
          ( cd _asset && sha256sum ai-memory-setup.exe > ai-memory-setup.exe.sha256 )
          cat _asset/ai-memory-setup.exe.sha256
          gh release upload "$TAG" _asset/ai-memory-setup.exe.sha256 --clobber
          echo "attached: $(gh release view "$TAG" --json assets --jq '.assets[].name' | tr '\n' ' ')"
