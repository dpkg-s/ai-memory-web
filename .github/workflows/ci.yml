# ai-memory-web（Web 控制台）的 CI。
#
# 本仓测试套有一个**外部依赖**：tests/test_web.py 的端到端段（F 段）要真起核心仓的
# serve_http.py。所以这里多一步 checkout ai-memory-template 到 `_core/`，并用
# `AI_MEMORY_CORE_DIR` 指过去 —— 这既是逃生门也是唯一入口：本仓自 1.1.0 起
# **不再自动上溯**（core_path.py 已删除），找不到核心仓测试会 exit 2。
#
# 为什么不在本仓复制一份 serve_http.py：核心模块的唯一事实源在 ai-memory-template，
# 复制即制造第二份事实源（1.1.0 的花费正是为了拆掉它）。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout web
        uses: actions/checkout@v4

      - name: Checkout core（端到端段需要 serve_http.py）
        uses: actions/checkout@v4
        with:
          repository: dpkg-s/ai-memory-template
          path: _core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        env:
          AI_MEMORY_CORE_DIR: ${{ github.workspace }}/_core
        run: python tests/test_web.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # 本仓没有自己的 ruff.toml（风格配置在核心仓那边，不跨仓借用），所以只查
      # **语法级致命错误**这一最小集 —— 默认规则集会因缺配置而报大量风格噪音，
      # 让 CI 常红反而会让人忽略真正的失败。
      - name: Ruff check (E9/F63/F7/F82)
        run: ruff check --select E9,F63,F7,F82 web_console.py serve_web.py tests/
