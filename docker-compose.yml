# ai-memory-web 控制台的 compose 样例
#
#   docker compose up -d --build
#   # 打开 http://127.0.0.1:8811 ，用 admin / password 登录
#
# 🔴 默认口令只是首次启动的种子：/config/users.json 一旦有内容就不再理会环境变量。
#    第一次登录后请到「访问控制」页改掉，或删掉 am-conf 卷重来。

services:
  ai-memory-web:
    build: .
    image: ai-memory-web:1.11.0
    container_name: ai-memory-web
    ports:
      - "8811:8811"
    environment:
      AI_MEMORY_WEB_USER: admin
      AI_MEMORY_WEB_PASSWORD: password
      # 上游 MCP 端点：容器内的 127.0.0.1 是它自己，必须指到容器外
      AI_MEMORY_WEB_MCP: ${AI_MEMORY_WEB_MCP:-http://host.docker.internal:8700/mcp}
      # 会话寿命（秒），默认 7 天
      # AI_MEMORY_WEB_SESSION_TTL: "604800"
    volumes:
      # config.json / users.json / tokens.json 都落在这里，别丢
      - am-conf:/config
      # 要读 vault（索引、笔记预览、阈值写入）时再打开，默认只读挂载
      # - /path/to/vault:/vault:ro
    restart: unless-stopped

volumes:
  am-conf:
